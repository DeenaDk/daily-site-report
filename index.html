<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Site Report</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0E1D1C; --paper:#EAEDEC; --paper2:#F5F6F4; --ink:#16302E; --ink-soft:#5A625F;
    --accent:#A50021; --red:#A50021; --green:#3E6B3E; --steel:#4A4A4C;
    --line:rgba(0,0,0,0.14); --line-soft:rgba(0,0,0,0.08); --radius:8px;
    --font-display:'Oswald',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--ink);}
  .shell{max-width:980px;margin:0 auto;min-height:100vh;background:var(--paper);}
  .topbar{background:var(--ink);color:var(--paper2);padding:14px 20px;position:sticky;top:0;z-index:30;border-bottom:3px solid var(--accent);display:flex;flex-direction:column;gap:10px;}
  .topbar-row2{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .brand{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:0.4px;text-transform:uppercase;}
  .brand span{color:var(--accent);}
  .admin-btn{background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:8px 16px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;border-radius:6px;cursor:pointer;flex-shrink:0;white-space:nowrap;}
  .admin-btn:hover{background:var(--accent);color:#FFF6F2;}
  .tabs{display:flex;gap:4px;}
  .tabbtn{background:none;border:1px solid rgba(255,255,255,0.15);color:#B9B6A9;padding:8px 14px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;border-radius:6px;cursor:pointer;}
  .tabbtn.active{background:var(--accent);color:#FFF6F2;border-color:var(--accent);}
  main{padding:20px;}
  .section-title{font-family:var(--font-display);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .card{background:var(--paper2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-bottom:4px;}
  select,input[type=text],input[type=number],input[type=date],textarea{width:100%;font-family:var(--font-body);font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);margin-bottom:10px;}
  textarea{resize:vertical;min-height:60px;}
  select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px;}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}
  .btn{font-family:var(--font-body);font-size:13px;font-weight:600;padding:9px 14px;border-radius:6px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;}
  .btn.primary{background:var(--ink);color:var(--accent);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn.danger{border-color:var(--red);color:var(--red);}
  .btn:active{transform:translateY(1px);}
  details.acc{background:var(--paper2);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
  details.acc summary{padding:12px 16px;font-family:var(--font-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0.6px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;background:#EBE6D8;}
  details.acc summary::-webkit-details-marker{display:none;}
  details.acc summary .cnt{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);font-weight:400;text-transform:none;}
  .acc-body{padding:14px 16px;}
  table.dyn{width:100%;border-collapse:collapse;margin-bottom:10px;}
  table.dyn th{font-size:10px;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-soft);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.dyn td{padding:3px 4px;border-bottom:1px solid var(--line-soft);}
  table.dyn input,table.dyn select{margin:0;padding:6px 7px;font-size:12px;min-width:80px;}
  .dyn-wrap{overflow-x:auto;}
  .rmrow{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:0 6px;}
  .projcard{background:var(--paper2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .projcard.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;}
  .projcard .pn{font-family:var(--font-display);font-weight:600;font-size:15px;}
  .projcard .ps{font-size:12px;color:var(--ink-soft);}
  .photostrip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .thumb{width:64px;height:64px;border-radius:6px;object-fit:cover;border:1px solid var(--line);}
  .addphoto{width:64px;height:64px;border-radius:6px;border:1px dashed var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink-soft);cursor:pointer;}
  .reportcard{background:var(--paper2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
  .reportcard .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .reportcard .rn{font-family:var(--font-display);font-weight:600;font-size:15px;}
  .reportcard .rs{font-size:12px;color:var(--ink-soft);}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--accent);font-size:13px;font-weight:600;padding:11px 18px;border-radius:8px;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center;}
  .toast.show{opacity:1;}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13px;}
  label.required::after{content:" *";color:var(--red);}
  .weatherrow{display:flex;gap:8px;align-items:flex-end;}
  .weatherrow .btn{margin-bottom:10px;white-space:nowrap;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand"><img id="logoImg" alt="Martushev logo" style="height:26px;vertical-align:middle;margin-right:10px;"> DAILY<span>SITE REPORT</span></div>
    <div class="topbar-row2">
      <div class="tabs" id="tabsBar"></div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span id="identityBadge" style="font-size:11px;font-family:var(--font-mono);color:#B9B6A9;"></span>
        <button class="admin-btn" id="adminToggle"></button>
      </div>
    </div>
  </div>
  <main id="view"></main>
  <div class="toast" id="toast"></div>
</div>

function computeLabourSplit(rows,otT,dtT){
  const cum={};
  rows.forEach(row=>{
    const key=(row.name||'').trim().toLowerCase()||('_row_'+Math.random());
    const start=cum[key]||0;
    const total=Number(row.totalHours)||0;
    const end=start+total;
    const rt=Math.max(0,Math.min(end,otT)-start);
    const ot=Math.max(0,Math.min(end,dtT)-Math.max(start,otT));
    const dt=Math.max(0,end-Math.max(start,dtT));
    row.rtHours=rt.toFixed(2);
    row.otHours=ot.toFixed(2);
    row.dtHours=dt.toFixed(2);
    cum[key]=end;
  });
}

const MODULES=[
  {key:'jobsetup',label:'Job setup'},
  {key:'employees',label:'Employees'},
  {key:'equipment',label:'Equipment'},
  {key:'access',label:'Access control'},
  {key:'newreport',label:'New report'},
  {key:'savedreports',label:'Saved reports'}
];
function freshPermissions(){
  const p={};MODULES.forEach(m=>p[m.key]='none');return p;
}
function loggedInPerson(){
  return state.operatorSession?state.employees.find(e=>e.id===state.operatorSession):null;
}
function myPermission(moduleKey){
  if(state.adminMode)return 'edit';
  const p=loggedInPerson();
  if(!p||!p.permissions)return 'none';
  return p.permissions[moduleKey]||'none';
}
function canView(moduleKey){return myPermission(moduleKey)!=='none';}
function canEdit(moduleKey){return myPermission(moduleKey)==='edit';}
function mySupervisedProjectIds(){
  if(state.adminMode)return null; // null = unrestricted
  const p=loggedInPerson();
  if(!p)return [];
  if(myPermission('newreport')==='none'&&myPermission('savedreports')==='none')return [];
  return p.supervisedProjectIds||[];
}
function visibleProjects(){
  const scope=mySupervisedProjectIds();
  return scope===null?state.projects:state.projects.filter(p=>scope.includes(p.id));
}

function visibleTabs(){
  const tabs=[{key:'myentry',label:'My Entry'}];
  if(canView('newreport'))tabs.push({key:'new',label:'New report'});
  if(canView('savedreports'))tabs.push({key:'saved',label:'Saved reports'});
  if(canView('jobsetup'))tabs.push({key:'jobsetup',label:'Job setup'});
  if(canView('employees'))tabs.push({key:'employees',label:'Employees'});
  if(canView('equipment'))tabs.push({key:'equipment',label:'Equipment'});
  if(canView('access'))tabs.push({key:'access',label:'Access control'});
  return tabs;
}

function renderTabsBar(){
  const tabs=visibleTabs();
  document.getElementById('tabsBar').innerHTML=tabs.map(t=>`<button class="tabbtn ${t.key===state.tab?'active':''}" data-tab="${t.key}">${t.label}</button>`).join('');
  document.querySelectorAll('#tabsBar .tabbtn').forEach(b=>{
    b.addEventListener('click',()=>{state.tab=b.dataset.tab;render();});
  });

  const person=loggedInPerson();
  const badge=document.getElementById('identityBadge');
  if(person){
    const perms=person.permissions||{};
    const grantedModules=MODULES.filter(m=>perms[m.key]&&perms[m.key]!=='none').map(m=>m.label);
    const accessLabel=grantedModules.length?grantedModules.join(', '):'My Entry only';
    badge.textContent='Signed in: '+person.name+' ('+accessLabel+')'+(state.adminMode?' \u00B7 Admin mode':'');
  }else if(state.adminMode){
    badge.textContent='Signed in: Admin (master password)';
  }else{
    badge.textContent='Not signed in';
  }

  const adminBtn=document.getElementById('adminToggle');
  adminBtn.textContent=state.adminMode?'Exit admin mode':'Admin mode';
  adminBtn.onclick=()=>{
    if(state.adminMode){
      state.adminMode=false;
      if(!visibleTabs().some(t=>t.key===state.tab))state.tab='myentry';
      render();
    }else{
      const pw=window.prompt('Enter admin password:');
      if(pw===state.adminPassword){
        state.adminMode=true;
        state.operatorSession=null;
        state.myEntryDraft=null;
        state.tab='jobsetup';
        render();
      }
      else if(pw!==null)showToast('Incorrect password');
    }
  };
}

function generateTicket(projectId,date){
  const proj=state.projects.find(p=>p.id===projectId);
  const projCode=proj?(proj.companyProjectNum||proj.clientProjectNum||proj.id.slice(0,4)).toString().replace(/[^A-Za-z0-9]/g,'').slice(0,6).toUpperCase():'JOB';
  const dateCode=date.replace(/-/g,'');
  const usedToday=[
    ...state.operatorEntries.filter(oe=>oe.projectId===projectId&&oe.date===date),
    ...state.reports.filter(r=>r.projectId===projectId&&r.date===date).flatMap(r=>[...r.directLabour,...r.indirectLabour])
  ];
  const seq=usedToday.length+1;
  return projCode+'-'+dateCode+'-'+String(seq).padStart(3,'0');
}

function mergeOperatorEntries(r){
  const pending=state.operatorEntries.filter(oe=>oe.projectId===r.projectId&&oe.date===r.date&&oe.status==='submitted');
  pending.forEach(oe=>{
    const already=r.directLabour.some(row=>row._operatorEntryId===oe.id);
    if(already)return;
    const emp=state.employees.find(e=>e.id===oe.employeeId);
    r.directLabour.push({
      costCode:oe.costCode,ticket:oe.ticket,position:emp?emp.position:"",name:emp?emp.name:"",
      comments:oe.comments,totalHours:oe.totalHours,travel:oe.travel,truck:oe.truck,truckId:oe.truckId,loa:oe.loa,
      equipUnitId:oe.equipUnitId,equipName:oe.equipName,equipHours:oe.equipHours||"",productiveHrs:"",nonProductiveHrs:"",repairHrs:"",
      _operatorEntryId:oe.id
    });
  });
}

function render(){
  const allowed=visibleTabs().map(t=>t.key);
  if(!allowed.includes(state.tab))state.tab='myentry';
  const scope=mySupervisedProjectIds();
  if(scope!==null&&(!state.activeProjectId||!scope.includes(state.activeProjectId))){
    state.activeProjectId=scope[0]||null;
    state.currentReport=null;
  }
  if(state.tab==='new'){
    if(!state.currentReport||state.currentReport.projectId!==state.activeProjectId){
      const today=new Date().toISOString().slice(0,10);
      const existing=state.reports.find(r=>r.projectId===state.activeProjectId&&r.date===today);
      state.currentReport=existing?JSON.parse(JSON.stringify(existing)):freshReport(state.activeProjectId);
    }
    mergeOperatorEntries(state.currentReport);
  }
  if(state.tab==='myentry'&&state.operatorSession&&!state.myEntryDraft){
    state.myEntryDraft={projectId:null,date:new Date().toISOString().slice(0,10),costCode:"",totalHours:"",travel:"",truck:"No",truckId:"",loa:"No",equipName:"",equipHours:"",comments:""};
  }
  renderTabsBar();
  const view=document.getElementById('view');
  if(state.tab==='jobsetup')view.innerHTML=renderJobSetup();
  else if(state.tab==='employees')view.innerHTML=renderEmployeesPage();
  else if(state.tab==='equipment')view.innerHTML=renderEquipmentPage();
  else if(state.tab==='access')view.innerHTML=renderAccessControl();
  else if(state.tab==='myentry')view.innerHTML=renderMyEntry();
  else if(state.tab==='new')view.innerHTML=renderNewReport();
  else view.innerHTML=renderSaved();
  bindView();
  schedulePersist();
}

const STORAGE_KEY='martushev-daily-site-report-v1';
let persistTimer=null;
let storageAvailable=(typeof window!=='undefined'&&!!window.storage);

function schedulePersist(){
  if(!storageAvailable)return;
  clearTimeout(persistTimer);
  persistTimer=setTimeout(persistState,500);
}

async function persistState(){
  if(!storageAvailable)return;
  try{
    const payload={
      companyName:state.companyName,
      adminPassword:state.adminPassword,
      projects:state.projects,
      employees:state.employees,
      equipment:state.equipment,
      reports:state.reports,
      operatorEntries:state.operatorEntries,
      notifications:state.notifications
    };
    await window.storage.set(STORAGE_KEY,JSON.stringify(payload),true);
  }catch(e){
    console.error('Could not save to persistent storage',e);
  }
}

async function loadState(){
  if(!storageAvailable)return false;
  try{
    const result=await window.storage.get(STORAGE_KEY,true);
    if(!result||!result.value)return false;
    const saved=JSON.parse(result.value);
    if(!saved||typeof saved!=='object')return false;
    Object.assign(state,saved);
    return true;
  }catch(e){
    console.error('Could not load persistent storage',e);
    return false;
  }
}

function renderDynSection(key,rows){
  const cfg=SECTIONS[key];
  const dis=canEdit('newreport')?'':'disabled';
  const headRow=cfg.columns.map(c=>`<th>${c.label}</th>`).join('')+'<th></th>';
  const bodyRows=rows.map((row,i)=>{
    const cells=cfg.columns.map(c=>{
      if(c.type==='select'){
        return `<td><select ${dis} data-dyn="${key}.${i}.${c.key}"><option value="">-</option>${c.options.map(o=>`<option ${row[c.key]===o?'selected':''}>${o}</option>`).join('')}</select></td>`;
      }
      if(c.type==='employee-select'){
        const opts=state.employees.slice().sort((a,b)=>(b.active-a.active)||a.name.localeCompare(b.name))
          .map(e=>`<option value="${e.name}" ${row[c.key]===e.name?'selected':''}>${e.name}${e.active?'':' (inactive)'}</option>`).join('');
        return `<td><select ${dis} data-dyn="${key}.${i}.${c.key}"><option value="">Select employee</option>${opts}</select></td>`;
      }
      if(c.type==='equipment-select'){
        const opts=state.equipment.slice().sort((a,b)=>(b.active-a.active)||a.name.localeCompare(b.name))
          .map(e=>`<option value="${e.name}" ${row[c.key]===e.name?'selected':''}>${e.name}${e.active?'':' (inactive)'}</option>`).join('');
        return `<td><select ${dis} data-dyn="${key}.${i}.${c.key}"><option value="">Select equipment</option>${opts}</select></td>`;
      }
      if(c.type==='costcode-select'){
        const proj=activeProject();
        const codes=proj?proj.costCodes.slice().sort((a,b)=>(b.active-a.active)||a.code.localeCompare(b.code)):[];
        const opts=codes.map(cc=>`<option value="${cc.code}" ${row[c.key]===cc.code?'selected':''}>${cc.code}${cc.name?' \u2014 '+cc.name:''}${cc.active?'':' (inactive)'}</option>`).join('');
        return `<td><select ${dis} data-dyn="${key}.${i}.${c.key}"><option value="">Select cost code</option>${opts}</select></td>`;
      }
      if(c.type==='computed'){
        return `<td style="font-family:var(--font-mono);color:var(--ink-soft);white-space:nowrap;">${row[c.key]!==undefined?row[c.key]:'0.00'}</td>`;
      }
      return `<td><input ${dis} type="${c.type}" data-dyn="${key}.${i}.${c.key}" value="${row[c.key]!==undefined?row[c.key]:''}"></td>`;
    }).join('');
    return `<tr>${cells}<td>${canEdit('newreport')?`<button class="rmrow" data-rmrow="${key}.${i}">\u2715</button>`:''}</td></tr>`;
  }).join('');
  return `
    <details class="acc"><summary>${cfg.label} <span class="cnt">${rows.length} row${rows.length===1?'':'s'}</span></summary>
      <div class="acc-body">
        <div class="dyn-wrap"><table class="dyn"><thead><tr>${headRow}</tr></thead><tbody>${bodyRows}</tbody></table></div>
        ${canEdit('newreport')?`<button class="btn small" data-addrow="${key}">Add row</button>`:''}
      </div>
    </details>`;
}

      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">Generates one Employee Timesheet workbook, one sheet per employee, covering every job that employee worked across ${state.adminMode?'ALL projects':'your assigned jobs'} in that date range \u2014 formatted for payroll.</div>
      <button class="btn primary" id="btn-payroll">Generate payroll Excel</button>
    </div>` : '';

  if(scopedReports.length===0)return payrollCard+`<div class="empty">No reports saved yet.</div>`;

  const tree={};
  scopedReports.forEach(r=>{
    const proj=state.projects.find(p=>p.id===r.projectId);
    const pname=proj?(proj.clientProjectName||proj.clientName||'Untitled project'):'Unknown project';
    const d=new Date(r.date+'T00:00:00');
    const year=d.getFullYear();
    const month=d.toLocaleDateString(undefined,{month:'long'});
    tree[pname]=tree[pname]||{};
    tree[pname][year]=tree[pname][year]||{};
    tree[pname][year][month]=tree[pname][year][month]||[];
    tree[pname][year][month].push(r);
  });

  let html=payrollCard+'<div class="section-title">Saved reports</div>';
  Object.keys(tree).sort().forEach(pname=>{
    const years=tree[pname];
    const pCount=Object.values(years).reduce((s,mo)=>s+Object.values(mo).reduce((s2,arr)=>s2+arr.length,0),0);
    html+=`<details class="acc"><summary>${pname} <span class="cnt">${pCount} report${pCount===1?'':'s'}</span></summary><div class="acc-body">`;
    Object.keys(years).sort((a,b)=>b-a).forEach(year=>{
      const months=years[year];
      const yCount=Object.values(months).reduce((s,arr)=>s+arr.length,0);
      html+=`<details class="acc"><summary>${year} <span class="cnt">${yCount}</span></summary><div class="acc-body">`;
      Object.keys(months)
        .map(mname=>({mname,reports:months[mname],idx:new Date(months[mname][0].date+'T00:00:00').getMonth()}))
        .sort((a,b)=>b.idx-a.idx)
        .forEach(me=>{
          html+=`<details class="acc"><summary>${me.mname} <span class="cnt">${me.reports.length}</span></summary><div class="acc-body">`;
          me.reports.sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{html+=reportCardHtml(r);});
          html+='</div></details>';
        });
      html+='</div></details>';
    });
    html+='</div></details>';
  });
  return html;
}

      });
    });
    document.querySelectorAll('[data-deleq]').forEach(btn=>{
      btn.addEventListener('click',()=>{

    document.querySelectorAll('[data-editeq]').forEach(btn=>{

    bindIf('btn-eqed-cancel','click',()=>{state.equipmentEditor=null;render();});
    bindIf('btn-eqed-save','click',()=>{

      if(!name){showToast('Enter an equipment name');return;}

    document.querySelectorAll('[data-notif-read]').forEach(btn=>{

        render();
      });
    });

      bindIf('me-date','change',e=>{d.date=e.target.value;});
      bindIf('me-costcode','change',e=>{d.costCode=e.target.value;});
      bindIf('me-hours','input',e=>{d.totalHours=e.target.value;});
      bindIf('me-travel','input',e=>{d.travel=e.target.value;});
      bindIf('me-truck','change',e=>{d.truck=e.target.value;if(d.truck==='No')d.truckId="";render();});
      bindIf('me-truckid','input',e=>{d.truckId=e.target.value;});
      bindIf('me-loa','change',e=>{d.loa=e.target.value;});
      bindIf('me-equip','input',e=>{d.equipName=e.target.value;});
      bindIf('me-equiphours','input',e=>{d.equipHours=e.target.value;});
      bindIf('me-comments','input',e=>{d.comments=e.target.value;});

      bindIf('btn-me-submit','click',()=>{
        if(!d.projectId){showToast('Select a project');return;}
        if(!d.costCode){showToast('Select a cost code');return;}
        if(!d.date){showToast('Select a date');return;}
        if(!d.totalHours||Number(d.totalHours)<=0){showToast('Enter your total hours');return;}
        const eq=state.equipment.find(e=>e.name===d.equipName);
        state.operatorEntries.push({
          id:uid(),employeeId:state.operatorSession,projectId:d.projectId,date:d.date,
          costCode:d.costCode,ticket:generateTicket(d.projectId,d.date),totalHours:Number(d.totalHours),travel:Number(d.travel)||0,
          truck:d.truck,truckId:d.truck==='No'?'':d.truckId,loa:d.loa,
          equipName:d.equipName,equipUnitId:eq?eq.code:"",equipHours:d.equipName?(Number(d.equipHours)||0):"",
          comments:d.comments,status:'submitted',submittedAt:new Date().toISOString()
        });

    bindIf('rf-weatherAM','change',e=>{r.weatherAM=e.target.value;});
    bindIf('rf-weatherAMTemp','input',e=>{r.weatherAMTemp=e.target.value;});
    bindIf('rf-weatherPM','change',e=>{r.weatherPM=e.target.value;});
    bindIf('rf-weatherPMTemp','input',e=>{r.weatherPMTemp=e.target.value;});
    bindIf('rf-siteCond','input',e=>{r.siteConditionNotes=e.target.value;});
    bindIf('rf-notesTeam','input',e=>{r.notesForTeam=e.target.value;});
    bindIf('rf-worksum','input',e=>{r.workSummary=e.target.value;});
    bindIf('rf-rfis','input',e=>{r.rfisNotices=e.target.value;});
    bindIf('btn-useweather','click',useCurrentWeather);

    document.querySelectorAll('[data-inc]').forEach(inp=>{
      inp.addEventListener('input',()=>{
        const [i,key]=inp.dataset.inc.split('.');
        r.incidentLog[Number(i)][key]=inp.value;
      });
    });

    document.querySelectorAll('[data-dyn]').forEach(inp=>{
      const evt=inp.tagName==='SELECT'?'change':'input';
      inp.addEventListener(evt,()=>{
        const [key,iStr,field]=inp.dataset.dyn.split('.');
        const i=Number(iStr);
        r[key][i][field]=inp.value;
        const col=SECTIONS[key].columns.find(c=>c.key===field);
        if(col&&col.type==='employee-select'&&col.fillPosition){
          const emp=state.employees.find(e=>e.name===inp.value);
          if(emp)r[key][i][col.fillPosition]=emp.position;
          render();return;
        }
        if(col&&col.type==='equipment-select'&&col.fillCode){
          const eq=state.equipment.find(e=>e.name===inp.value);
          if(eq)r[key][i][col.fillCode]=eq.code;
          render();return;
        }
        if(col&&col.type==='costcode-select'&&col.fillName){
          const proj=activeProject();
          const cc=proj&&proj.costCodes.find(c=>c.code===inp.value);
          if(cc)r[key][i][col.fillName]=cc.name;
          render();return;
        }
      });
    });
    document.querySelectorAll('[data-addrow]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        r[btn.dataset.addrow].push(newRow(btn.dataset.addrow));
        render();
      });
    });
    document.querySelectorAll('[data-rmrow]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const [key,i]=btn.dataset.rmrow.split('.');
        r[key].splice(Number(i),1);
        render();
      });
    });

    const photoCam=document.getElementById('rf-photo-camera');
    const photoLib=document.getElementById('rf-photo-library');
    const handlePhoto=e=>{
      const file=e.target.files[0];if(!file)return;
      resizeImage(file,480,dataUrl=>{r.photos.push(dataUrl);render();});
    };
    if(photoCam)photoCam.addEventListener('change',handlePhoto);
    if(photoLib)photoLib.addEventListener('change',handlePhoto);
    document.querySelectorAll('[data-rmphoto]').forEach(img=>{
      img.addEventListener('click',()=>{r.photos.splice(Number(img.dataset.rmphoto),1);render();});
    });

    const NOTIFY_FIELDS=[
      {key:'costCode',label:'Cost code'},{key:'totalHours',label:'Total hours'},{key:'travel',label:'Travel'},
      {key:'truck',label:'Pickup truck'},{key:'truckId',label:'Truck ID'},{key:'loa',label:'LOA'},
      {key:'equipName',label:'Equipment used'},{key:'equipHours',label:'Equipment hours'},{key:'comments',label:'Comments'}
    ];
    function diffAndSyncOperatorEntry(row){
      const oe=state.operatorEntries.find(x=>x.id===row._operatorEntryId);
      if(!oe)return;
      const changes=[];
      NOTIFY_FIELDS.forEach(f=>{
        const oldVal=(oe[f.key]===undefined||oe[f.key]===null)?'':String(oe[f.key]);
        const newVal=(row[f.key]===undefined||row[f.key]===null)?'':String(row[f.key]);
        if(oldVal!==newVal)changes.push({field:f.key,label:f.label,oldValue:oldVal||'(blank)',newValue:newVal||'(blank)'});
      });
      if(changes.length){
        const who=loggedInPerson();
        state.notifications.push({
          id:uid(),employeeId:oe.employeeId,date:oe.date,ticket:oe.ticket,
          changes,changedBy:who?who.name:(state.adminMode?'Admin':'Supervisor'),
          timestamp:new Date().toISOString(),read:false
        });
      }
      NOTIFY_FIELDS.forEach(f=>{oe[f.key]=row[f.key];});
      ['totalHours','travel','equipHours'].forEach(nk=>{
        if(oe[nk]!==''&&oe[nk]!==undefined)oe[nk]=Number(oe[nk])||0;
      });
    }

    const persistReport=(finalStatus)=>{
      const activeP=activeProject();
      const otT=Number(activeP.otDailyThreshold)||8;
      const dtT=Number(activeP.dtDailyThreshold)||12;
      computeLabourSplit(r.directLabour,otT,dtT);
      computeLabourSplit(r.indirectLabour,otT,dtT);
      r.status=finalStatus;
      r.directLabour.forEach(row=>{if(row._operatorEntryId)diffAndSyncOperatorEntry(row);});
      const idx=state.reports.findIndex(x=>x.id===r.id);
      if(idx>-1)state.reports[idx]=JSON.parse(JSON.stringify(r));
      else state.reports.push(JSON.parse(JSON.stringify(r)));
      if(finalStatus==='confirmed'){
        r.directLabour.forEach(row=>{
          if(row._operatorEntryId){
            const oe=state.operatorEntries.find(x=>x.id===row._operatorEntryId);
            if(oe)oe.status='confirmed';
          }
        });
      }
    };

    bindIf('btn-savereport','click',()=>{
      persistReport('draft');
      showToast('Draft saved');
      state.tab='saved';render();
    });

    bindIf('btn-confirmreport','click',()=>{
      persistReport('confirmed');
      showToast('Report confirmed and submitted');
      state.tab='saved';render();
    });
  }

  if(state.tab==='saved'){
    document.querySelectorAll('[data-editreport]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const rep=state.reports.find(x=>x.id===btn.dataset.editreport);
        state.currentReport=JSON.parse(JSON.stringify(rep));
        state.activeProjectId=rep.projectId;
        state.tab='new';render();
      });
    });
    document.querySelectorAll('[data-delreport]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        state.reports=state.reports.filter(x=>x.id!==btn.dataset.delreport);
        render();
      });
    });
    document.querySelectorAll('[data-pdf]').forEach(btn=>{
      btn.addEventListener('click',()=>exportPDF(state.reports.find(x=>x.id===btn.dataset.pdf)));
    });
    bindIf('btn-payroll','click',()=>{
      const start=val('pr-start');
      const end=val('pr-end');
      exportPayrollXLSX(start,end);
    });
  }
}

function val(id){return document.getElementById(id).value;}
function bindIf(id,evt,fn){const el=document.getElementById(id);if(el)el.addEventListener(evt,fn);}

function resizeImage(file,maxW,cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,maxW/img.width);
      const canvas=document.createElement('canvas');
      canvas.width=img.width*scale;canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL('image/jpeg',0.72));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function useCurrentWeather(){
  if(!navigator.geolocation){showToast('Geolocation not available');return;}
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current=temperature_2m,weather_code`);
      const data=await res.json();
      const code=data.current.weather_code;
      const map={0:"Sunny",1:"Sunny",2:"Overcast",3:"Overcast",45:"Fog",48:"Fog",51:"Raining",53:"Raining",55:"Raining",61:"Raining",63:"Raining",65:"Raining",71:"Snowing",73:"Snowing",75:"Snowing",80:"Raining",81:"Raining",82:"Raining",95:"Raining",96:"Raining",99:"Raining"};
      state.currentReport.weatherAM=map[code]||"Overcast";
      state.currentReport.weatherAMTemp=Math.round(data.current.temperature_2m);
      render();showToast('Weather updated');
    }catch(err){showToast('Could not fetch weather');}
  },err=>showToast('Could not get location: '+err.message));
}

function exportPDF(r){
  const proj=state.projects.find(p=>p.id===r.projectId);
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  try{doc.addImage(LOGO_DATA_URI,'PNG',141,8,55,6.3);}catch(e){}
  doc.setFontSize(15);doc.text(state.companyName,14,15);
  doc.setFontSize(11);doc.text('Project - Daily Site Report',14,22);
  doc.setFontSize(9);doc.text('Date: '+r.date+'  ('+r.shift+' shift, '+dayName(r.date)+')',14,28);

  let y=34;
  doc.autoTable({startY:y,head:[['Project information','']],body:[
    ['Client name',proj.clientName],['Client project #',proj.clientProjectNum],
    ['Client project name',proj.clientProjectName],['Company project #',proj.companyProjectNum],
    ['Company project name',proj.companyProjectName]
  ],styles:{fontSize:8},headStyles:{fillColor:[22,48,46]}});
  y=doc.lastAutoTable.finalY+4;

  CONTACT_BLOCKS.forEach(b=>{
    const c=proj[b.key];
    doc.autoTable({startY:y,head:[[b.label,'']],body:CONTACT_KEYS.map(k=>[CONTACT_LABELS[k],c[k]||'']),styles:{fontSize:8},headStyles:{fillColor:[74,74,76]}});
    y=doc.lastAutoTable.finalY+4;
  });

  doc.autoTable({startY:y,head:[['Incident type','Comment','Today','To date']],body:r.incidentLog.map(i=>[i.type,i.comment,i.today,i.toDate]),styles:{fontSize:8},headStyles:{fillColor:[165,0,33]}});
  y=doc.lastAutoTable.finalY+4;

  doc.autoTable({startY:y,head:[['Daily HSE highlights']],body:[[r.hseHighlights||'']],styles:{fontSize:8},headStyles:{fillColor:[22,48,46]}});
  y=doc.lastAutoTable.finalY+4;

  doc.autoTable({startY:y,head:[['Site conditions','']],body:[
    ['Weather AM',r.weatherAM+' '+r.weatherAMTemp+'C'],['Weather PM',r.weatherPM+' '+r.weatherPMTemp+'C'],
    ['Site condition notes',r.siteConditionNotes],['Notes for project team',r.notesForTeam]
  ],styles:{fontSize:8},headStyles:{fillColor:[74,74,76]}});
  y=doc.lastAutoTable.finalY+4;

  doc.autoTable({startY:y,head:[['Daily summary of work performed']],body:[[r.workSummary||'']],styles:{fontSize:8},headStyles:{fillColor:[22,48,46]}});
  y=doc.lastAutoTable.finalY+4;

  doc.autoTable({startY:y,head:[['RFIs, notices, client comments, deviations']],body:[[r.rfisNotices||'']],styles:{fontSize:8},headStyles:{fillColor:[22,48,46]}});
  y=doc.lastAutoTable.finalY+4;

  if(r.delayLog.length){
    doc.autoTable({startY:y,head:[SECTIONS.delayLog.columns.map(c=>c.label)],body:r.delayLog.map(row=>SECTIONS.delayLog.columns.map(c=>row[c.key])),styles:{fontSize:7},headStyles:{fillColor:[165,0,33],textColor:[255,246,242]}});
    y=doc.lastAutoTable.finalY+4;
  }

  Object.keys(SECTIONS).forEach(key=>{
    if(key==='delayLog')return;
    const cfg=SECTIONS[key];
    if(!r[key].length)return;
    if(y>250){doc.addPage();y=15;}
    doc.autoTable({startY:y,head:[cfg.columns.map(c=>c.label)],body:r[key].map(row=>cfg.columns.map(c=>row[c.key])),styles:{fontSize:6.5},headStyles:{fillColor:[74,74,76]}});
    y=doc.lastAutoTable.finalY+4;
  });

  doc.save('daily-site-report-'+r.date+'.pdf');
  showToast('PDF exported');
}

const MONTH_ABBR=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW_ABBR=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function shortDate(d){return String(d.getDate()).padStart(2,'0')+'-'+MONTH_ABBR[d.getMonth()];}
function sumField(rows,key){return rows.reduce((s,r)=>s+(Number(r[key])||0),0);}

function exportPayrollXLSX(start,end){
  if(!start||!end||start>end){showToast('Check the pay period dates');return;}

  const scopedProjectIds=new Set(visibleProjects().map(p=>p.id));
  const reports=state.reports.filter(r=>r.date>=start&&r.date<=end&&scopedProjectIds.has(r.projectId));

  const empNamesInRange=new Set();
  reports.forEach(r=>{
    [...r.directLabour,...r.indirectLabour].forEach(e=>{if(e.name)empNamesInRange.add(e.name);});
  });

  if(empNamesInRange.size===0){showToast('No labour entries found in that date range');return;}

  const wb=XLSX.utils.book_new();

  empNamesInRange.forEach(empName=>{
    const emp=state.employees.find(e=>e.name===empName)||{name:empName,employeeId:'',contractor:false,taxExempt:false,vendor:''};
    const rows=[];
    rows.push(['Employee Timesheet']);
    rows.push([]);
    rows.push(['Name:',emp.name,'','','','','Employee Id:',emp.employeeId||'']);
    rows.push([]);
    rows.push(['Pay Period Start Date:',shortDate(new Date(start+'T00:00:00')),'','','','','Contractor:',emp.contractor?'Y':'N']);
    rows.push(['Pay Period End Date:',shortDate(new Date(end+'T00:00:00')),'','','','','Tax Exempt:',emp.taxExempt?'Y':'N']);
    rows.push(['Associated Vendor:',emp.vendor||'']);
    rows.push([]);
    rows.push(['Day','Date','Job','Ticket','Total Hours','Reg','OT','DT','Travel','Truck','LOA','Province']);

    const totals={total:0,reg:0,ot:0,dt:0,travel:0,loa:0};
    let cursor=new Date(start+'T00:00:00');
    const endD=new Date(end+'T00:00:00');
    while(cursor<=endD){
      const dateStr=cursor.toISOString().slice(0,10);
      const dow=DOW_ABBR[cursor.getDay()];
      const dayReports=reports.filter(r=>r.date===dateStr);
      let entries=[];
      const jobsForDay=[];
      dayReports.forEach(rep=>{
        const empEntries=[...rep.directLabour,...rep.indirectLabour].filter(e=>e.name===empName);
        if(empEntries.length){
          const proj=state.projects.find(p=>p.id===rep.projectId);
          jobsForDay.push({proj,entries:empEntries});
          entries=entries.concat(empEntries);
        }
      });
      if(entries.length===0){
        rows.push([dow,shortDate(cursor),'','','','','','','','','','']);
      }else{
        const totalHrs=sumField(entries,'totalHours');
        const reg=sumField(entries,'rtHours');
        const ot=sumField(entries,'otHours');
        const dt=sumField(entries,'dtHours');
        const travel=sumField(entries,'travel');
        const ticket=entries.map(e=>e.ticket).filter(Boolean).join(', ');
        const truckYes=entries.some(e=>e.truck&&e.truck!=='No');
        const truckIds=[...new Set(entries.filter(e=>e.truckId).map(e=>e.truckId))].join(', ');
        const loaYes=entries.some(e=>e.loa==='Yes');
        const jobNames=[...new Set(jobsForDay.map(j=>j.proj?(j.proj.clientProjectName||j.proj.clientName):'Unknown project'))].join(' / ');
        const provinces=[...new Set(jobsForDay.map(j=>j.proj?j.proj.province:'').filter(Boolean))].join('/');
        rows.push([dow,shortDate(cursor),jobNames,ticket,totalHrs.toFixed(2),reg.toFixed(2),ot.toFixed(2),dt.toFixed(2),travel.toFixed(2),truckYes?(truckIds||'Y'):'',loaYes?'1.00':'',provinces]);
        totals.total+=totalHrs;totals.reg+=reg;totals.ot+=ot;totals.dt+=dt;totals.travel+=travel;if(loaYes)totals.loa+=1;
      }
      cursor.setDate(cursor.getDate()+1);
    }
    rows.push([]);
    rows.push(['','','','',totals.total.toFixed(2),totals.reg.toFixed(2),totals.ot.toFixed(2),totals.dt.toFixed(2),totals.travel.toFixed(2),'',totals.loa.toFixed(2),'']);

    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:6},{wch:9},{wch:34},{wch:10},{wch:11},{wch:8},{wch:7},{wch:7},{wch:8},{wch:10},{wch:7},{wch:8}];
    let sheetName=empName.replace(/[:\\\/\?\*\[\]]/g,'').slice(0,31);
    XLSX.utils.book_append_sheet(wb,ws,sheetName||'Employee');
  });

  XLSX.writeFile(wb,'payroll-timesheet-'+start+'-to-'+end+'.xlsx');
  showToast('Payroll Excel exported');
}

(async function boot(){
  document.getElementById('view').innerHTML='<div class="empty">Loading\u2026</div>';
  let loaded=false;
  try{
    loaded=await loadState();
  }catch(e){
    console.error('Startup load failed',e);
  }
  if(!loaded){
    seed();
    if(storageAvailable){
      try{await persistState();}catch(e){console.error('Initial save failed',e);}
    }
  }
  if(!storageAvailable){
    showToast('Running without saved storage \u2014 data in this session will not carry over to next time you open this file.');
  }
  render();
})();
</script>
